# Enforces Conventional Commit PR titles. With squash-merge, the PR title becomes the commit
# release-please parses to decide the version bump and changelog section. See
# docs/development/release-strategy.md §6.
name: Conventional PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint-title:
    if: github.repository == 'project-akri/akri'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `opt` is kept as an Akri alias (mapped to Performance & Optimizations in the
          # changelog). Open decision: migrate to `perf` — see release-backlog.md.
          types: |
            feat
            fix
            perf
            opt
            deps
            refactor
            docs
            test
            ci
            build
            chore
            revert
