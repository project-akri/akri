# Drift guard (Phase-2 cutover replacement for the old check-versioning.yml).
#
# Versions and the changelog are now owned by release-please. Contributors must NOT hand-edit
# version.txt, the workspace version in Cargo.toml, Chart.yaml version/appVersion, or
# CHANGELOG.md — those change only inside release-please's Release PR. This job fails a PR that
# touches them. release-please's own Release PRs (head branch `release-please--*`) are exempt.
name: Version guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    # Exempt release-please's Release PRs, which legitimately edit these files.
    if: ${{ github.repository == 'project-akri/akri' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block manual version / changelog edits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if echo "$changed" | grep -qx "version.txt"; then
            echo "::error file=version.txt::version.txt is managed by release-please; do not edit it manually."
            fail=1
          fi
          if echo "$changed" | grep -qx "CHANGELOG.md"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is generated by release-please; do not edit it manually."
            fail=1
          fi
          # Only flag Cargo.toml / Chart.yaml when the version lines themselves change,
          # so legitimate dependency/chart edits are not blocked.
          if git diff "$BASE_SHA" "$HEAD_SHA" -- Cargo.toml | grep -qE '^\+version = '; then
            echo "::error file=Cargo.toml::The workspace version is managed by release-please; do not bump it manually."
            fail=1
          fi
          if git diff "$BASE_SHA" "$HEAD_SHA" -- deployment/helm/Chart.yaml | grep -qE '^\+(version|appVersion):'; then
            echo "::error file=deployment/helm/Chart.yaml::Chart version/appVersion are managed by release-please; do not bump them manually."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Versions and the changelog are automated. Remove these edits — the bump and"
            echo "changelog entry happen in the release-please Release PR. For an intentional"
            echo "out-of-band version, use a 'Release-As: X.Y.Z' commit footer."
            echo "See docs/development/release-strategy.md."
            exit 1
          fi
          echo "No manual version/changelog edits detected."
